
name: Start Remote Database

on:
  push:
    branches:
      - env-test
      - env-qa
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postgis-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  start-db:
    runs-on: self-hosted

    environment:
      name: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure environment
        shell: bash
        env:
          DB_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail

          case "$GITHUB_REF_NAME" in
            env-test) PORT=5444 ;;
            env-qa) PORT=5445 ;;
            main) PORT=5446 ;;
            *) exit 1 ;;
          esac

          test -n "$DB_PASSWORD"

          echo "POSTGRES_PORT=$PORT" >> "$GITHUB_ENV"
          echo "POSTGRES_USER=psip" >> "$GITHUB_ENV"
          echo "POSTGRES_DB=psip" >> "$GITHUB_ENV"

      - name: Start PostGIS
        shell: bash
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail

          docker compose \
            -f docker-compose-remote.yml \
            -p "remote-db-${GITHUB_REF_NAME}" \
            up -d --build --wait postgis python

      - name: Generate H3 grid
        shell: bash
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          docker compose \
            -f docker-compose-remote.yml \
            -p "remote-db-${GITHUB_REF_NAME}" \
            exec -T python python /app/h3_generator.py

      - name: Load data into PostGIS
        shell: bash
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          docker compose \
            -f docker-compose-remote.yml \
            -p "remote-db-${GITHUB_REF_NAME}" \
            exec -T python python /app/load.py

      - name: Verify H3 data
        shell: bash
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          docker compose \
            -f docker-compose-remote.yml \
            -p "remote-db-${GITHUB_REF_NAME}" \
            exec -T postgis \
            psql -U psip -d psip \
            -v ON_ERROR_STOP=1 \
            -c "SELECT COUNT(*) FROM grid.h3_grid;"

      # LAB 4: normalizacja, wagi, IOP i mapy. Wymaga grid.h3_aggregation
      # (load_bdot.py + aggregate_h3.py) - bez niej krok jest pomijany z ostrzezeniem.
      - name: Compute IOP
        id: iop
        shell: bash
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail
          compose() {
            docker compose -f docker-compose-remote.yml -p "remote-db-${GITHUB_REF_NAME}" "$@"
          }
          exists=$(compose exec -T postgis psql -U psip -d psip -tAc \
            "SELECT to_regclass('grid.h3_aggregation') IS NOT NULL")
          if [ "$exists" != "t" ]; then
            echo "::warning::Brak grid.h3_aggregation - pomijam IOP. Uruchom load_bdot.py i aggregate_h3.py."
            exit 0
          fi
          compose exec -T python python /app/compute_iop.py
          compose exec -T python python /app/plot_iop.py
          rm -rf iop_output
          compose cp python:/app/output ./iop_output
          echo "maps=true" >> "$GITHUB_OUTPUT"

      - name: Upload IOP maps
        if: steps.iop.outputs.maps == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: iop-maps-${{ github.ref_name }}
          path: iop_output/*.png

      - name: Show running containers
        shell: bash
        run: |
          docker ps
          docker volume ls
